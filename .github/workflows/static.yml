name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check site
        run: python3 tools/check-site-0.1.0.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify published policy
        run: |
          url="https://addenda.rychle.info/sis-login-fix/privacy/"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 6 --retry-all-errors --retry-delay 5 --max-time 20 "$url" -o /tmp/privacy.html
          cmp site/sis-login-fix/privacy/index.html /tmp/privacy.html
          printf 'Verified policy: %s\n' "$url"
